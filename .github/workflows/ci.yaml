name: CI

on:
  push:
    branches: [main]
  pull_request:
  # release.yaml calls this rather than restating the job list, so the gate a
  # tag has to pass is the same one every pull request passes, by construction.
  workflow_call:

jobs:
  dart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      # Scoped to the workspace on purpose. examples/ holds a Flutter app, whose
      # generated sources use Flutter-SDK language features and whose lints
      # resolve only under `flutter pub get`. Plain Dart tooling cannot parse it
      # and reports that as a formatting failure. The flutter job below covers it.
      - run: dart format --output=none --set-exit-if-changed packages/
      # Warnings are fatal; missing-doc infos are surfaced but do not gate,
      # so documenting enum values is a nudge rather than a blocker.
      - run: dart analyze --fatal-warnings packages/
      # Every package with a suite, not just the core. A package whose tests
      # are never run is a package without tests.
      - run: dart test
        working-directory: packages/fluttorch
      # The parity gate on every pull request, which includes replaying the
      # export committed under testdata/. Running it against a device backend
      # is M25; the recipe consumers copy is in docs/ci-parity-gate.md.
      - run: dart test
        working-directory: packages/fluttorch_test
      - run: dart test
        working-directory: packages/fluttorch_gen
      - run: dart test
        working-directory: packages/fluttorch_executorch
      # The generator has to actually run, not merely be unit-tested: the
      # committed output is regenerated and must come back identical, which
      # catches a builder that works only in a test harness.
      - run: dart run build_runner build --delete-conflicting-outputs
        working-directory: examples/typed_api
      - run: git diff --exit-code examples/typed_api/lib
      - run: dart test
        working-directory: examples/typed_api

  # The M2 spike is a Flutter app, so it needs the Flutter SDK to resolve and
  # parse at all. Analysis only: running it means building for macOS and loading
  # a native ExecuTorch library, which belongs on the real-device CI of M25.
  flutter-spike:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
        working-directory: examples/spike/flutter_spike
      - run: flutter analyze
        working-directory: examples/spike/flutter_spike
      - run: dart format --output=none --set-exit-if-changed integration_test lib
        working-directory: examples/spike/flutter_spike

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install ruff pytest
      - run: ruff check python/
      - run: ruff format --check python/
      # The manifest module has no torch dependency, so its suite runs here.
      # The shared fixture is asserted from both sides: this job checks Python
      # still writes it, the dart job checks Dart still reproduces it.
      - run: python -m pytest python/fluttorch_export/tests -q
        env:
          PYTHONPATH: python/fluttorch_export
