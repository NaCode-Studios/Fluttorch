name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed .
      # Warnings are fatal; missing-doc infos are surfaced but do not gate,
      # so documenting enum values is a nudge rather than a blocker.
      - run: dart analyze --fatal-warnings
      # Every package with a suite, not just the core — a package whose tests
      # are never run is a package without tests.
      - run: dart test
        working-directory: packages/fluttorch
      - run: dart test
        working-directory: packages/fluttorch_test
      - run: dart test
        working-directory: packages/fluttorch_gen

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check python/
      - run: ruff format --check python/
