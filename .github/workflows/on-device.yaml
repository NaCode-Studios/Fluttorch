name: On device

# The parity matrix, run on hardware rather than described.
#
# Every other job in this repository proves something about the code. This one
# proves the claim the project exists to make: that a model exported here
# produces the same numbers on a real accelerator, and that where it does not,
# the gate says by how much. Nothing below is checkable on a runner that only
# has Dart.
#
# Dispatch only, and not because it is optional. One complete run measured an
# hour and a quarter on a three-core macOS runner, which is by a wide margin the
# largest single block of compute this repository asks for. It ran weekly until
# the first complete run made that number real, and a timer measures the
# calendar rather than what changed: nothing about this answer moves in a week
# where the native half did not. So it runs when somebody wants the evidence,
# which in practice is before a release and after the binding changes.
#
# The on-device suite skips by name everywhere else, which is what keeps the
# fast jobs honest about what they did not cover.

on:
  workflow_dispatch:

# Pinned, because the cache key is only meaningful against one version and
# because every upstream friction this repository has hit was version-specific.
#
# The directory has to be called `executorch`, with no leading dot. Its own
# CMakeLists refuses to configure under any other name, which is upstream issue
# 6475 and not a preference. A dot was the obvious way to keep the clone out of
# Dart's way, and it is the one name that cannot work.
env:
  EXECUTORCH_REF: v1.3.0
  EXECUTORCH_DIR: ${{ github.workspace }}/executorch

jobs:
  matrix:
    # Apple silicon, which is what makes Core ML and MPS answerable at all. The
    # backends this runner cannot carry are reported as not run by the matrix
    # tool rather than omitted from it.
    runs-on: macos-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Cache the ExecuTorch build
        id: cache
        uses: actions/cache@v4
        with:
          path: ${{ env.EXECUTORCH_DIR }}
          # Both files that decide what the tree contains are in the key. The
          # build script decides which delegates are linked; this workflow holds
          # the cmake configure, which decides what was compiled in the first
          # place. Hashing only the script meant a changed configure restored a
          # tree built under the old one, and the tests would fail against a
          # runtime nobody could see the flags for.
          key: executorch-${{ env.EXECUTORCH_REF }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/fluttorch_executorch/tool/build_native.sh', '.github/workflows/on-device.yaml') }}

      # ExecuTorch's kernel codegen is Python, and CMake runs it as the last
      # target of the build. Its four generators import yaml, and three of them
      # import torchgen, which is not a package of its own: it ships inside the
      # torch wheel. Without them the build reaches 100 per cent and dies on the
      # final generated file, which puts the error an hour and a quarter after
      # the mistake that caused it. Pinned to the torch upstream's own installer
      # pins for this ref, because the codegen and the runtime are one version.
      - name: What the kernel codegen imports
        if: steps.cache.outputs.cache-hit != 'true'
        run: pip install torch==2.12.0 pyyaml

      # DEVTOOLS is what compiles the tracer hooks that activation taps read
      # through. They are #ifdef'd inside the executor, so a shim built against
      # a runtime without it collects nothing and reports every layer absent,
      # and the suite says so: the first complete run failed one assertion, that
      # this build can read intermediates. A job that exercises three of the
      # four hooks this binding exists for is not the job this is meant to be.
      - name: Build ExecuTorch
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$EXECUTORCH_REF" --recurse-submodules \
            https://github.com/pytorch/executorch.git "$EXECUTORCH_DIR"
          cmake -B "$EXECUTORCH_DIR/cmake-out" -S "$EXECUTORCH_DIR" \
            -DCMAKE_BUILD_TYPE=Release \
            -DEXECUTORCH_BUILD_XNNPACK=ON \
            -DEXECUTORCH_BUILD_MPS=ON \
            -DEXECUTORCH_BUILD_DEVTOOLS=ON \
            -DEXECUTORCH_BUILD_EXTENSION_MODULE=ON \
            -DEXECUTORCH_BUILD_EXTENSION_NAMED_DATA_MAP=ON \
            -DEXECUTORCH_BUILD_EXTENSION_TENSOR=ON \
            -DEXECUTORCH_BUILD_EXTENSION_DATA_LOADER=ON \
            -DEXECUTORCH_BUILD_EXTENSION_FLAT_TENSOR=ON
          cmake --build "$EXECUTORCH_DIR/cmake-out" -j

      # Core ML is deliberately not in the configure above. Linking its runtime
      # needs coremltools built and its generated protobuf sources copied into
      # the checkout, which the header of build_native.sh describes in full. The
      # matrix reports it as not run here rather than pretending otherwise.
      - name: Build the binding
        run: packages/fluttorch_executorch/tool/build_native.sh "$EXECUTORCH_DIR"

      - run: dart pub get

      - name: The on-device suite
        working-directory: packages/fluttorch_executorch
        run: dart test

      # The report M24 asks for, printed into the run's log so a reader does not
      # have to reconstruct it from test names. Non-zero when any cell fails.
      - name: The parity matrix
        working-directory: packages/fluttorch_executorch
        run: dart run tool/parity_matrix.dart
