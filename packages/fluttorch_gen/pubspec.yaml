name: fluttorch_gen
description: Generates a typed Dart API from a Fluttorch model manifest, so shapes, dtypes and preprocessing cannot drift from the training pipeline.
version: 1.0.0
repository: https://github.com/NaCode-Studios/Fluttorch
homepage: https://nacodestudios.it/en/project/fluttorch
issue_tracker: https://github.com/NaCode-Studios/Fluttorch/issues
funding:
  - https://github.com/sponsors/NaCode-Studios

topics:
  - pytorch
  - code-generation
  - build-runner
  - on-device

environment:
  sdk: ^3.9.0

resolution: workspace

dependencies:
  build: ^4.0.0
  # The generator formats its own output with the formatter the repository uses,
  # so generated code needs no formatting pass and a golden cannot drift from the
  # emitter over whitespace.
  dart_style: ^3.0.0
  fluttorch: ^1.0.0
  pub_semver: ^2.1.0

dev_dependencies:
  build_runner: ^2.16.0
  lints: ^6.0.0
  test: ^1.25.0
