name: fluttorch_gen
description: Generates a typed Dart API from a Fluttorch model manifest, so shapes, dtypes and preprocessing cannot drift from the training pipeline.
version: 0.0.1-dev
repository: https://github.com/NaCode-Studios/Fluttorch
publish_to: none

environment:
  sdk: ^3.9.0

resolution: workspace

dependencies:
  build: ^4.0.9
  fluttorch: ^0.0.1-dev
  source_gen: ^4.2.4

dev_dependencies:
  build_runner: ^2.15.3
  lints: ^6.0.0
  test: ^1.31.2
